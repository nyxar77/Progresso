<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>progresso</title>
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/navbar.css" />
    <script src="scripts/app.js" defer></script>
    <script type="module" src="routing/paths.js" defer></script>
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;

          if (savedTheme) {
            document.documentElement.setAttribute("data-theme", savedTheme);
          } else if (prefersDark) {
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>

  <body>
    <nav id="main-nav">
      <div class="nav-container">
        <a onclick="redirect('/home')" id="nav-logo">Progresso</a>

        <ul class="nav-links">
          <li>
            <a
              path="/dashboard"
              onclick="redirect('/dashboard')"
              class="nav-link"
              >dashboard</a
            >
          </li>
          <li>
            <a path="/quizzes" onclick="redirect('/quizzes')" class="nav-link"
              >My Quizzes</a
            >
          </li>
          <li>
            <a path="/login" onclick="redirect('/login')" class="nav-link cta"
              >Login</a
            >
          </li>
          <li>
            <a path="/about" onclick="redirect('/about')" class="nav-link cta"
              >about</a
            >
          </li>
          <li>
            <button
              class="nav-link theme-switch"
              onclick="toggleTheme()"
              aria-label="Toggle light/dark theme"
            >
              <svg
                class="icon-sun"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <svg
                class="icon-moon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                ></path>
              </svg>
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <div id="app"></div>

    <script>
      function toggleTheme() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        try {
          localStorage.setItem("theme", newTheme);
        } catch (e) {
          console.warn("Could not save theme to localStorage.");
        }
      }
    </script>
  </body>
</html>
